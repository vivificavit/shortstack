name: Tests & Build

on:
  push:
    branches: [main]
  pull_request:

# The build only needs to read the code; it can't push, tag or edit issues.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Matches gradle/gradle-daemon-jvm.properties so Gradle doesn't look for another JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23

      - uses: gradle/actions/setup-gradle@v4

      # The release build is unsigned here (no keystore.properties); it's built so a change
      # that breaks R8 shrinking fails the check instead of turning up at release time.
      - name: Unit tests, lint, debug build and release (R8) build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
